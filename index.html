<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Training Attendance</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="fixed inset-0 -z-10">
        <div class="absolute top-0 left-0 w-full h-80 bg-gradient-to-r from-blue-700 to-indigo-800 rounded-b-[2.5rem] shadow-xl"></div>
    </div>

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        
        <div class="text-white mb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold flex items-center gap-3 drop-shadow-md">
                    <i class="fa-solid fa-clipboard-user"></i> វត្តមាន IT_Training
                </h1>
                <p class="opacity-90 mt-2 text-sm font-light">កត់ត្រាវត្តមានប្រចាំថ្ងៃយ៉ាងងាយស្រួល</p>
            </div>
            
            <div class="text-right bg-white/10 backdrop-blur-md px-4 py-2 rounded-xl border border-white/20">
                <div class="text-xs opacity-80 font-poppins uppercase tracking-wider">Today's Date</div>
                <div id="dateDisplay" class="text-lg font-bold font-poppins text-white">Loading...</div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-lg border-l-8 border-blue-500 flex items-center justify-between transform hover:scale-[1.01] transition-all duration-300">
                <div>
                    <p class="text-gray-400 text-sm font-medium">បុគ្គលិកសរុប</p>
                    <h3 class="text-4xl font-bold text-blue-600 mt-1 font-poppins" id="totalStaff">0</h3>
                </div>
                <div class="w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center text-blue-500 shadow-sm">
                    <i class="fa-solid fa-users text-2xl"></i>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-lg border-l-8 border-green-500 flex items-center justify-between transform hover:scale-[1.01] transition-all duration-300">
                <div>
                    <p class="text-gray-400 text-sm font-medium">វត្តមាន (OT)</p>
                    <h3 class="text-4xl font-bold text-green-600 mt-1 font-poppins" id="totalOT">0</h3>
                </div>
                <div class="w-14 h-14 bg-green-50 rounded-full flex items-center justify-center text-green-500 shadow-sm">
                    <i class="fa-solid fa-clock text-2xl"></i>
                </div>
            </div>
        </div>

        <div class="relative mb-6 group">
            <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                <i class="fa-solid fa-search text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
            </div>
            <input type="text" id="searchInput" placeholder="ស្វែងរកឈ្មោះបុគ្គលិក..." 
                class="w-full pl-12 pr-6 py-4 rounded-2xl border-none shadow-lg focus:ring-4 focus:ring-blue-500/20 outline-none text-gray-700 font-medium transition-all placeholder-gray-400">
        </div>

        <div id="loading" class="flex flex-col items-center justify-center py-12">
            <div class="w-12 h-12 border-4 border-white border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-white font-medium animate-pulse">កំពុងទាញទិន្នន័យ...</p>
        </div>

        <div id="contentArea" class="hidden animate-fade-in-up">
            <div class="hidden md:block bg-white rounded-2xl shadow-xl overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b border-gray-100">
                        <tr>
                            <th class="py-5 px-6 text-left w-20 text-gray-400 font-poppins">#</th>
                            <th class="py-5 px-6 text-left text-gray-600 font-bold">ឈ្មោះ</th>
                            <th class="py-5 px-6 text-center text-gray-600 font-bold">ភេទ</th>
                            <th class="py-5 px-6 text-center text-gray-600 font-bold">ស្ថានភាព</th>
                            <th class="py-5 px-6 text-right text-gray-600 font-bold">សកម្មភាព</th>
                        </tr>
                    </thead>
                    <tbody id="desktopTableBody" class="divide-y divide-gray-50">
                        </tbody>
                </table>
            </div>

            <div id="mobileCardContainer" class="md:hidden space-y-4">
                </div>
            
            <div id="noResult" class="hidden text-center py-12 bg-white rounded-2xl shadow-lg mt-4">
                <i class="fa-solid fa-folder-open text-5xl text-gray-200 mb-4 block"></i>
                <p class="text-gray-400 font-medium">រកមិនឃើញឈ្មោះនេះទេ</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
